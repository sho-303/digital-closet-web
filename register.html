<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Closet - 服の登録</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .page-header {
            margin-bottom: 24px;
        }
        .page-header .sub-title {
            font-size: 11px;
            letter-spacing: 0.15em;
            color: #718096;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .page-header h1 {
            font-size: 22px;
            font-weight: 500;
            color: #1a202c;
            margin: 0;
        }
        .form-section {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 6px;
        }
        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            font-size: 13px;
            color: #1a202c;
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .image-preview-container {
            width: 100%;
            height: 200px;
            border: 2px dashed #cbd5e0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f7fafc;
            margin-bottom: 12px;
            overflow: hidden;
            position: relative;
        }
        .image-preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .btn-primary {
            width: 100%;
            padding: 11px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            background-color: #2d3748;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">DIGITAL CLOSET</a>
        </div>
        <button class="menu-button" type="button" aria-label="メニューを開く">☰</button>

    <main class="main" style="max-width: 480px; margin: 32px auto; padding: 0 16px; box-sizing: border-box;">

        <div class="page-header">
            <p class="sub-title">Add New Item</p>
            <h1>服の登録</h1>
        </div>

        <section class="form-section">
            <form id="itemRegisterForm">
                
                <!-- 画像アップロード＆プレビュー -->
                <div class="form-group">
                    <label>服の写真</label>
                    <div class="image-preview-container" id="previewContainer">
                        <span id="previewPlaceholder" style="color: #a0aec0; font-size: 13px;">タップして画像を選択</span>
                        <img id="imagePreview" alt="プレビュー">
                    </div>
                    <input type="file" id="itemImage" accept="image/*" style="display: none;">
                </div>

                <!-- 服の名称 -->
                <div class="form-group">
                    <label for="itemName">アイテム名 <span style="color: #e53e3e;">*</span></label>
                    <input type="text" id="itemName" class="form-input" placeholder="例: ネイビー フルジップパーカー" required>
                </div>

                <!-- カテゴリ -->
                <div class="form-group">
                    <label for="itemCategory">カテゴリ <span style="color: #e53e3e;">*</span></label>
                    <select id="itemCategory" class="form-select" required>
                        <option value="">選択してください</option>
                        <option value="Tシャツ/カットソー">Tシャツ/カットソー</option>
                        <option value="シャツ">シャツ</option>
                        <option value="パーカー/スウェット">パーカー/スウェット</option>
                        <option value="ニット/セーター">ニット/セーター</option>
                        <option value="ジャケット/アウター">ジャケット/アウター</option>
                        <option value="パンツ">パンツ</option>
                        <option value="シューズ">シューズ</option>
                    </select>
                </div>

                <!-- カラー -->
                <div class="form-group">
                    <label for="itemColor">カラー</label>
                    <select id="itemColor" class="form-select">
                        <option value="ネイビー">ネイビー</option>
                        <option value="ブラック">ブラック</option>
                        <option value="ホワイト">ホワイト</option>
                        <option value="グレー">グレー</option>
                        <option value="ブルー">ブルー</option>
                        <option value="その他">その他</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">パスワード（確認用）</label>
                    <input type="password" id="confirmPassword" placeholder="もう一度入力してください" required>
                </div>

                <!-- ブランド/メモ -->
                <div class="form-group">
                    <label for="itemBrand">ブランド / メモ</label>
                    <input type="text" id="itemBrand" class="form-input" placeholder="例: adidas / お気に入り">
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 12px;">
                    クローゼットに追加する
                </button>
            </form>
        </section>

    </main>

    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
